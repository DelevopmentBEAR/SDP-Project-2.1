<!DOCTYPE html>
<html>
<head>
    <title>Writer's Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div>
        <h1 align="center"><b>Writer's Chatbot</b></h1>
        <h4 align="center"><b>Please start your personalized interaction with the chatbot</b></h4>
        <div class="boxed">
            <div>
                <div id="chatbox">
                    <p class="botText">
                        <span>Hi! I'm your AI-Writer's Assistant Chatbot</span>
                    </p>
                </div>
                <div id="userInput">
                    <input id="textInput" type="text" name="msg" placeholder="Message" />
                    <button id="sendButton" onclick="getBotResponse()">Send</button>
                </div>
            </div>
           <script>
                function getBotResponse() {
                    var rawText = $("#textInput").val();
                    if (!rawText.trim()) return;

                    var userHtml = '<p class="userText"><span>' + rawText + "</span></p>";
                    $("#textInput").val("");
                    $("#chatbox").append(userHtml);

                    $.post("/chat", { question: rawText }).done(function (data) {
                        var botHtml = '<p class="botText"><span>' + data.answer + "</span></p>";
                        $("#chatbox").append(botHtml);
                    });
                }
            </script>
        </div>
    </div>
     <div>
        <a href="{{ url_for('homepage') }}" class="button">Back to Homepage</a>
    </div>
</body>
</html>
