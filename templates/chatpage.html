<!DOCTYPE html>
<html>
<head>
    <title>Writer's Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div>
        <h1 align="center"><b>Writer's Chatbot</b></h1>
        <h4 align="center"><b>Please start your personalized interaction with the chatbot</b></h4>
        <div class="boxed">
            <div>
                <div id="chatbox">
                    <p class="botText">
                        <span>Hi! I'm your AI-Writer's Assistant Chatbot</span>
                    </p>
                </div>
                <div id="userInput">
                    <input id="textInput" type="text" name="msg" placeholder="Message" />
                    <button id="sendButton" onclick="getBotResponse()">Send</button>
                </div>
            </div>
            <script>
                {% comment %} Gets the user's message from the input field and sends it to the server {% endcomment %}
                function getBotResponse() {
                    {% comment %} Gets the user's message from the input field {% endcomment %}
                    var rawText = $("#textInput").val(); 

                    {% comment %} Creates HTML for the user's message {% endcomment %}
                    var userHtml = '<p class="userText"><span>' + rawText + "</span></p>";

                    {% comment %} Clears the input field {% endcomment %}
                    $("#textInput").val("");

                    {% comment %} Appends the user's message to the chatbox {% endcomment %}
                    $("#chatbox").append(userHtml);

                    {% comment %} Scrolls the chatbox to the bottom {% endcomment %}
                    document
                        .getElementById("userInput")
                        .scrollIntoView({ block: "start", behavior: "smooth" });

                    {% comment %} Gets the bot's response from the server {% endcomment %}
                    $.get("/get", { msg: rawText }).done(function (data) {

                        {% comment %} Creates HTML for the bot's response {% endcomment %}
                        var botHtml = '<p class="botText"><span>' + data + "</span></p>";

                        {% comment %} Appends the bot's response to the chatbox {% endcomment %}
                        $("#chatbox").append(botHtml);

                        {% comment %} Scrolls the chatbox to the bottom {% endcomment %}
                        document
                            .getElementById("userInput")
                            .scrollIntoView({ block: "start", behavior: "smooth" });
                    });
                }

                {% comment %} Allows the user to press the Enter key to send a message {% endcomment %}
                $("#textInput").keypress(function (e) {
                    {% comment %} Checks if the Enter key was pressed {% endcomment %}
                    if (e.which == 13) {
                        {% comment %} Calls the function to get the bot's response {% endcomment %}
                        getBotResponse();
                    }
                });
            </script>
        </div>
    </div>
</body>
</html>
